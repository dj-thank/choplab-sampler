name: ChopLab

options:
  bundleIdPrefix: com.choplab
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "22"

targets:
  ChopLab:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ChopLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choplab.ios
        PRODUCT_NAME: ChopLab
        INFOPLIST_KEY_CFBundleDisplayName: おとひろい
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 音声を録音してPAD素材を作るために使用します。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - ChopLabTests
      gatherCoverageData: false

  ChopLabTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ChopLabTests
    dependencies:
      - target: ChopLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.choplab.ios.tests
        PRODUCT_NAME: ChopLabTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChopLab.app/ChopLab"
