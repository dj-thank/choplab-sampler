name: Publish Android preview APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate and build debug APK
        shell: bash
        run: |
          ./scripts/validate_project.sh
          ./gradlew --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ChopLab-${GITHUB_REF_NAME}-debug.apk"
          sha256sum "dist/ChopLab-${GITHUB_REF_NAME}-debug.apk" > "dist/ChopLab-${GITHUB_REF_NAME}-debug.apk.sha256"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/ChopLab-${GITHUB_REF_NAME}-debug.apk" \
            "dist/ChopLab-${GITHUB_REF_NAME}-debug.apk.sha256" \
            --title "ChopLab ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: choplab-${{ github.ref_name }}-debug-apk
          if-no-files-found: error
          path: dist/*
