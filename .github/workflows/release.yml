name: Build and publish immutable ChopLab releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  PYTHONUTF8: '1'
  CHOPLAB_SPOTIFY_CLIENT_ID: ${{ vars.CHOPLAB_SPOTIFY_CLIENT_ID }}

jobs:
  metadata:
    name: Validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      is_tag_release: ${{ steps.event.outputs.is_tag_release }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan current and historical public surface
        run: python3 scripts/check_public_surface.py --history

      - name: Test release policy scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate embedded version source and event
        id: release
        shell: bash
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            args+=(--tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --verify-annotated-tag --check-monotonic --reachable-ref refs/remotes/origin/main)
          fi
          python3 scripts/release_metadata.py "${args[@]}"

      - name: Establish event policy
        id: event
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo 'is_tag_release=true' >> "$GITHUB_OUTPUT"
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
              echo 'Release tags must point to a commit already reachable from main.' >&2
              exit 1
            }
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $GITHUB_REF_NAME already exists; published assets are immutable." >&2
              exit 1
            fi
          else
            echo 'is_tag_release=false' >> "$GITHUB_OUTPUT"
            echo 'workflow_dispatch builds verification artifacts only; it never publishes a Release.'
          fi

  build-android:
    name: Android signed release candidate
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          [[ "$sdkmanager_status" -eq 0 ]] || exit "$sdkmanager_status"
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Configure stable release signing
        if: needs.metadata.outputs.is_tag_release == 'true'
        shell: bash
        env:
          CHOPLAB_ANDROID_KEYSTORE_BASE64: ${{ secrets.CHOPLAB_ANDROID_KEYSTORE_BASE64 }}
          CHOPLAB_ANDROID_STORE_PASSWORD: ${{ secrets.CHOPLAB_ANDROID_STORE_PASSWORD }}
          CHOPLAB_ANDROID_KEY_ALIAS: ${{ secrets.CHOPLAB_ANDROID_KEY_ALIAS }}
          CHOPLAB_ANDROID_KEY_PASSWORD: ${{ secrets.CHOPLAB_ANDROID_KEY_PASSWORD }}
          CHOPLAB_ANDROID_CERT_SHA256: ${{ secrets.CHOPLAB_ANDROID_CERT_SHA256 }}
        run: python3 scripts/configure_android_signing.py --channel android

      - name: Validate, test, lint, build signed release, and generate SBOM
        shell: bash
        run: |
          ./scripts/validate_project.sh
          ./gradlew --stacktrace \
            :shared:testAndroidHostTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleRelease \
            cyclonedxBom

      - name: Inspect and stage Android artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          IS_TAG_RELEASE: ${{ needs.metadata.outputs.is_tag_release }}
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          [[ "${#release_apks[@]}" -eq 1 ]] || {
            printf 'Expected one release APK, found %s: %s\n' "${#release_apks[@]}" "${release_apks[*]}" >&2
            exit 1
          }
          verify_args=(
            --apk "${release_apks[0]}"
            --version "$RELEASE_VERSION"
            --version-code "$RELEASE_BUILD_NUMBER"
          )
          if [[ "$IS_TAG_RELEASE" == 'true' ]]; then
            verify_args+=(--require-signed --expected-cert-sha256 "$CHOPLAB_ANDROID_CERT_SHA256")
          fi
          python3 scripts/verify_android_release.py "${verify_args[@]}"

          sbom='build/reports/cyclonedx/bom.json'
          [[ -s "$sbom" ]] || {
            echo "CycloneDX SBOM was not generated at $sbom" >&2
            exit 1
          }
          python3 scripts/verify_sbom.py \
            --sbom "$sbom" \
            --group com.choplab \
            --name ChopLab \
            --version "$RELEASE_VERSION"
          mkdir -p dist
          apk_target="dist/ChopLab-${RELEASE_TAG}-android-release.apk"
          if [[ "$IS_TAG_RELEASE" != 'true' ]]; then apk_target="dist/ChopLab-${RELEASE_TAG}-android-unsigned-ci.apk"; fi
          sbom_target="dist/ChopLab-${RELEASE_TAG}-sbom.cdx.json"
          cp "${release_apks[0]}" "$apk_target"
          cp "$sbom" "$sbom_target"
          python3 scripts/check_public_surface.py \
            --archive "$apk_target" \
            --text-file "$sbom_target"
          for file in "$apk_target" "$sbom_target"; do
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$(basename "$file")" > "$file.sha256"
          done

      - name: Remove transient release key
        if: always()
        run: python3 scripts/configure_android_signing.py --channel android --cleanup

      - name: Upload Android and SBOM assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-android-release-assets
          if-no-files-found: error
          path: dist/*
          retention-days: 7

  build-windows:
    name: Windows app-image verification
    needs: metadata
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and package Windows app-image
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace :shared:desktopTest :jvm-core:test :desktop:test :desktop:desktopLongPressUiTest :desktop:packageWindows

      - name: Smoke packaged Windows app
        shell: pwsh
        run: .\scripts\smoke-windows-app.ps1 -AppImage 'desktop/build/windows-app-image/ChopLab'

      - name: Test data-preserving Windows user install
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: >-
          .\scripts\test-install-windows-app.ps1
          -AppImage 'desktop/build/windows-app-image/ChopLab'
          -ExpectedVersion $env:RELEASE_VERSION

      - name: Inspect and stage Windows artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          .\scripts\verify-windows-artifact.ps1 `
            -AppImage 'desktop/build/windows-app-image/ChopLab' `
            -ExpectedVersion $env:RELEASE_VERSION `
            -MetadataOutput "desktop/build/reports/windows-metadata.json"
          $archive = "dist/ChopLab-$env:RELEASE_TAG-windows-app-image.zip"
          Compress-Archive `
            -Path 'desktop/build/windows-app-image/ChopLab' `
            -DestinationPath $archive `
            -CompressionLevel Optimal
          python scripts/check_public_surface.py --archive $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -Encoding utf8 "$archive.sha256"

      - name: Upload Windows verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-windows-release-assets
          if-no-files-found: error
          path: dist/*
          retention-days: 7

  publish-release:
    name: Attest and publish immutable Release
    if: needs.metadata.outputs.is_tag_release == 'true'
    needs: [metadata, build-android, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Android release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: choplab-android-release-assets
          path: dist

      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: choplab-windows-release-assets
          path: dist

      - name: Refuse mutable or incomplete publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace any asset." >&2
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo 'Release commit is no longer reachable from main.' >&2
            exit 1
          }
          python3 scripts/release_metadata.py --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --verify-annotated-tag --check-monotonic --reachable-ref refs/remotes/origin/main

      - name: Scan final public archives
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          python3 scripts/check_public_surface.py \
            --archive "dist/ChopLab-${RELEASE_TAG}-android-release.apk" \
            --archive "dist/ChopLab-${RELEASE_TAG}-windows-app-image.zip" \
            --text-file "dist/ChopLab-${RELEASE_TAG}-sbom.cdx.json"

      - name: Scan every release asset
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          expected_assets=(
            "ChopLab-${RELEASE_TAG}-android-release.apk"
            "ChopLab-${RELEASE_TAG}-android-release.apk.sha256"
            "ChopLab-${RELEASE_TAG}-windows-app-image.zip"
            "ChopLab-${RELEASE_TAG}-windows-app-image.zip.sha256"
            "ChopLab-${RELEASE_TAG}-sbom.cdx.json"
            "ChopLab-${RELEASE_TAG}-sbom.cdx.json.sha256"
          )
          mapfile -d '' -t release_assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          [[ "${#release_assets[@]}" -gt 0 ]] || {
            echo 'No downloaded release assets found.' >&2
            exit 1
          }
          if find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo 'unsupported release asset: non-regular top-level entry.' >&2
            exit 1
          fi
          if find dist -maxdepth 1 -type l -print -quit | grep -q .; then
            echo 'unsupported release asset: symbolic links are not allowed.' >&2
            exit 1
          fi
          for expected in "${expected_assets[@]}"; do
            [[ -f "dist/$expected" && ! -L "dist/$expected" ]] || {
              echo "missing expected release asset: $expected" >&2
              exit 1
            }
          done
          scan_args=()
          for asset in "${release_assets[@]}"; do
            name="${asset##*/}"
            case " ${expected_assets[*]} " in
              *" $name "*) ;;
              *)
                echo "unsupported release asset: $name" >&2
                exit 1
                ;;
            esac
            case "$asset" in
              *.apk|*.aab|*.aar|*.ipa|*.jar|*.war|*.zip)
                scan_args+=(--archive "$asset")
                ;;
              *)
                scan_args+=(--text-file "$asset")
                ;;
            esac
          done
          python3 scripts/check_public_surface.py "${scan_args[@]}"

      - name: Write source-bound manifest and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          manifest="dist/ChopLab-${RELEASE_TAG}-release-manifest.json"
          python3 scripts/write_release_manifest.py \
            --directory dist \
            --output "$manifest" \
            --version "$RELEASE_VERSION" \
            --build-number "$RELEASE_BUILD_NUMBER" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID"
          (
            cd dist
            find . -maxdepth 1 -type f \
              ! -name '*.sha256' \
              ! -name 'SHA256SUMS' \
              -printf '%f\0' \
              | sort -z \
              | xargs -0 sha256sum
          ) > dist/SHA256SUMS

      - name: Scan final publication glob
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          expected_assets=(
            "ChopLab-${RELEASE_TAG}-android-release.apk"
            "ChopLab-${RELEASE_TAG}-android-release.apk.sha256"
            "ChopLab-${RELEASE_TAG}-windows-app-image.zip"
            "ChopLab-${RELEASE_TAG}-windows-app-image.zip.sha256"
            "ChopLab-${RELEASE_TAG}-sbom.cdx.json"
            "ChopLab-${RELEASE_TAG}-sbom.cdx.json.sha256"
            "ChopLab-${RELEASE_TAG}-release-manifest.json"
            "SHA256SUMS"
          )
          mapfile -d '' -t release_assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          [[ "${#release_assets[@]}" -gt 0 ]] || {
            echo 'No final release assets found.' >&2
            exit 1
          }
          if find dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo 'unsupported release asset: non-regular top-level entry.' >&2
            exit 1
          fi
          if find dist -maxdepth 1 -type l -print -quit | grep -q .; then
            echo 'unsupported release asset: symbolic links are not allowed.' >&2
            exit 1
          fi
          for expected in "${expected_assets[@]}"; do
            [[ -f "dist/$expected" && ! -L "dist/$expected" ]] || {
              echo "missing expected release asset: $expected" >&2
              exit 1
            }
          done
          scan_args=()
          for asset in "${release_assets[@]}"; do
            name="${asset##*/}"
            case " ${expected_assets[*]} " in
              *" $name "*) ;;
              *)
                echo "unsupported release asset: $name" >&2
                exit 1
                ;;
            esac
            case "$asset" in
              *.apk|*.aab|*.aar|*.ipa|*.jar|*.war|*.zip)
                scan_args+=(--archive "$asset")
                ;;
              *)
                scan_args+=(--text-file "$asset")
                ;;
            esac
          done
          python3 scripts/check_public_surface.py "${scan_args[@]}"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ChopLab-${{ needs.metadata.outputs.tag }}-android-release.apk
            dist/ChopLab-${{ needs.metadata.outputs.tag }}-windows-app-image.zip
            dist/ChopLab-${{ needs.metadata.outputs.tag }}-release-manifest.json
          subject-version: ${{ needs.metadata.outputs.version }}

      - name: Attest dependency SBOM for runnable artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ChopLab-${{ needs.metadata.outputs.tag }}-android-release.apk
            dist/ChopLab-${{ needs.metadata.outputs.tag }}-windows-app-image.zip
          subject-version: ${{ needs.metadata.outputs.version }}
          sbom-path: dist/ChopLab-${{ needs.metadata.outputs.tag }}-sbom.cdx.json

      - name: Revalidate annotated tag and release history before publication
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          # Refresh refs without changing the source checkout or its built artifacts.
          # A changed existing tag must fail; only the main tracking ref may advance.
          git fetch --atomic --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            'refs/tags/*:refs/tags/*'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo 'Release commit is no longer reachable from main.' >&2
            exit 1
          }
          python3 scripts/release_metadata.py \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --verify-annotated-tag \
            --check-monotonic \
            --reachable-ref refs/remotes/origin/main

      - name: Publish once without asset replacement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            dist/*
            --repo "$GITHUB_REPOSITORY"
            --title "ChopLab $RELEASE_TAG"
            --prerelease
            --verify-tag
          )
          if [[ -f "docs/releases/${RELEASE_TAG}.md" ]]; then
            release_args+=(--notes-file "docs/releases/${RELEASE_TAG}.md")
          else
            release_args+=(--generate-notes)
          fi
          gh release create "${release_args[@]}"
