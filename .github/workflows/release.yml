name: Publish Android, iOS, and Windows preview artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public surface
        run: python3 scripts/check_public_surface.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android components
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$sdkmanager_status" -ne 0 ]; then
            exit "$sdkmanager_status"
          fi
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate, test, and build Android preview on API 36 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            ./scripts/validate_project.sh
            ./gradlew --stacktrace :app:testDebugUnitTest :app:connectedDebugAndroidTest :app:lintDebug :app:assembleDebug

      - name: Prepare Android release assets
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/ChopLab-${GITHUB_REF_NAME}-debug.apk"
          apk="dist/ChopLab-${GITHUB_REF_NAME}-debug.apk"
          printf '%s  %s\n' "$(sha256sum "$apk" | awk '{print $1}')" "$(basename "$apk")" > "${apk}.sha256"

      - name: Upload Android release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-android-release-assets
          if-no-files-found: error
          path: dist/*

  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public surface
        run: python3 scripts/check_public_surface.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project and run iOS tests
        shell: bash
        run: |
          cd ios
          xcodegen generate --spec project.yml
          cd ..
          simulator_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $1; exit}' | xargs)"
          test -n "${simulator_name}"
          xcodebuild \
            -project ios/ChopLab.xcodeproj \
            -scheme ChopLab \
            -destination "platform=iOS Simulator,name=${simulator_name}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build and package iOS Simulator app
        shell: bash
        run: |
          export CHOPLAB_VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/build-ios-simulator.sh

      - name: Upload iOS release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-ios-release-assets
          if-no-files-found: error
          path: dist/*

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public surface
        shell: pwsh
        run: python scripts/check_public_surface.py

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and package Windows app-image
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace :desktop:test :desktop:packageWindows

      - name: Prepare Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $releaseName = $env:GITHUB_REF_NAME
          $appImage = Resolve-Path 'desktop/build/windows-app-image/ChopLab'
          $exe = Resolve-Path 'desktop/build/windows-app-image/ChopLab/ChopLab.exe'
          $zip = Join-Path (Get-Location) "dist/ChopLab-$releaseName-windows-app-image.zip"
          Compress-Archive -Path $appImage -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash + "  " + (Split-Path -Leaf $zip) | Set-Content -Encoding utf8 "$zip.sha256"
          Get-FileHash -LiteralPath $exe -Algorithm SHA256 | ConvertTo-Json | Set-Content -Encoding utf8 "dist/ChopLab-$releaseName-windows-exe.sha256.json"

      - name: Upload Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-windows-release-assets
          if-no-files-found: error
          path: dist/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-android, build-ios, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Android, iOS, and Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: choplab-*-release-assets
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          elif [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ChopLab ${GITHUB_REF_NAME}" \
              --prerelease \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
              --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ChopLab ${GITHUB_REF_NAME}" \
              --prerelease \
              --generate-notes \
              --verify-tag
          fi
