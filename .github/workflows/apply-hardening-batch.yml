name: Apply hardening batch

on:
  push:
    branches:
      - codex/choplab-full-hardening-20260821
    paths:
      - '.github/hardening-payload/**'
      - '.github/workflows/apply-hardening-batch.yml'

permissions:
  contents: write

concurrency:
  group: apply-hardening-batch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/choplab-full-hardening-20260821
          fetch-depth: 0

      - name: Decode and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/hardening-payload/part-* > /tmp/hardening.patch.gz.b64
          base64 --decode /tmp/hardening.patch.gz.b64 | gzip --decompress > /tmp/hardening.patch
          git apply --check /tmp/hardening.patch
          git apply --index /tmp/hardening.patch
          git rm -r .github/hardening-payload .github/workflows/apply-hardening-batch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hardening: enforce release and project resource boundaries'
          git push origin HEAD:codex/choplab-full-hardening-20260821
