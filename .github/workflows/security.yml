name: Supply-chain policy

on:
  push:
  pull_request:
  schedule:
    - cron: '17 18 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: History scan and dependency SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout complete reachable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test policy scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Scan current and historical public surface
        run: python3 scripts/check_public_surface.py --history

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve dependencies and generate CycloneDX SBOM
        run: ./gradlew --stacktrace cyclonedxBom

      - name: Require non-empty CycloneDX JSON
        run: test -s build/reports/cyclonedx/bom.json

      - name: Upload dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-cyclonedx-sbom
          if-no-files-found: error
          path: |
            build/reports/cyclonedx/bom.json
            build/reports/cyclonedx/bom.xml
          retention-days: 7
