name: Apply bounded I/O hardening patch

on:
  push:
    branches:
      - codex/choplab-full-hardening-20260821
    paths:
      - '.codex/apply_hardening.py'
      - '.github/workflows/codex-apply-hardening.yml'

permissions:
  contents: write

concurrency:
  group: codex-apply-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/choplab-full-hardening-20260821
          fetch-depth: 0

      - name: Apply exact source patches
        run: python3 .codex/apply_hardening.py

      - name: Test Python policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run focused JVM tests
        run: ./gradlew --stacktrace :shared:jvmTest :jvm-core:test :desktop:test

      - name: Remove one-shot patch machinery
        run: rm -f .codex/apply_hardening.py .github/workflows/codex-apply-hardening.yml

      - name: Commit verified patch
        shell: bash
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bound project residency and persist autosave renames"
          git push origin HEAD:codex/choplab-full-hardening-20260821
