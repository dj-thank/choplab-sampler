name: Windows desktop verification

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'shared/**'
      - 'jvm-core/**'
      - 'scripts/**'
      - 'docs/ui/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release policy scripts
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Read release metadata
        id: release
        shell: pwsh
        run: python scripts/release_metadata.py --github-output $env:GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and package Windows app-image
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace :jvm-core:test :desktop:test :desktop:packageWindows

      - name: Verify EXE version, record digest, and archive app-image
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          .\scripts\verify-windows-artifact.ps1 `
            -AppImage 'desktop/build/windows-app-image/ChopLab' `
            -ExpectedVersion $env:RELEASE_VERSION `
            -MetadataOutput 'dist/ChopLab-windows-metadata.json'
          Compress-Archive `
            -Path 'desktop/build/windows-app-image/ChopLab' `
            -DestinationPath 'dist/ChopLab-windows-app-image.zip' `
            -CompressionLevel Optimal
          $zip = Resolve-Path 'dist/ChopLab-windows-app-image.zip'
          (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + (Split-Path -Leaf $zip) |
            Set-Content -Encoding utf8 "$zip.sha256"

      - name: Upload Windows app-image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-windows-app-image
          if-no-files-found: error
          path: dist/*
