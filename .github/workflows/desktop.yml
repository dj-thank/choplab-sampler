name: Windows desktop verification

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows desktop verification
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public surface
        shell: pwsh
        run: python scripts/check_public_surface.py

      - name: Test release policy scripts
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Archive committed source for review validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          git archive --format=zip --output=dist/choplab-source-snapshot.zip HEAD
          python scripts/check_public_surface.py --source-archive dist/choplab-source-snapshot.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload committed source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-source-snapshot
          if-no-files-found: error
          path: dist/choplab-source-snapshot.zip
          retention-days: 1

      - name: Read release metadata
        id: release
        shell: pwsh
        run: python scripts/release_metadata.py --github-output $env:GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and package Windows app-image
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace :shared:desktopTest :jvm-core:test :desktop:test :desktop:desktopLongPressUiTest :desktop:packageWindows

      - name: Verify EXE version, record digest, and archive app-image
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          .\scripts\verify-windows-artifact.ps1 `
            -AppImage 'desktop/build/windows-app-image/ChopLab' `
            -ExpectedVersion $env:RELEASE_VERSION `
            -MetadataOutput 'dist/ChopLab-windows-metadata.json'
          Compress-Archive `
            -Path 'desktop/build/windows-app-image/ChopLab' `
            -DestinationPath 'dist/ChopLab-windows-app-image.zip' `
            -CompressionLevel Optimal
          $zip = Resolve-Path 'dist/ChopLab-windows-app-image.zip'
          python scripts/check_public_surface.py --archive $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + (Split-Path -Leaf $zip) |
            Set-Content -Encoding utf8 "$zip.sha256"

      - name: Test data-preserving Windows user install
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: >-
          .\scripts\test-install-windows-app.ps1
          -AppImage 'desktop/build/windows-app-image/ChopLab'
          -ExpectedVersion $env:RELEASE_VERSION

      - name: Upload Windows app-image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-windows-app-image
          if-no-files-found: error
          path: dist/*
