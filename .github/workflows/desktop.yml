name: Windows desktop verification

on:
  push:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
      - 'docs/ui/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test and package Windows app-image
        shell: pwsh
        run: .\gradlew.bat --no-daemon --stacktrace :desktop:test :desktop:packageWindows

      - name: Record EXE digest and archive app-image
        shell: pwsh
        run: |
          $exe = Resolve-Path 'desktop/build/windows-app-image/ChopLab/ChopLab.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-FileHash -LiteralPath $exe -Algorithm SHA256 | ConvertTo-Json | Set-Content -Encoding utf8 'dist/ChopLab.exe.sha256.json'
          Compress-Archive -Path 'desktop/build/windows-app-image/ChopLab' -DestinationPath 'dist/ChopLab-windows-app-image.zip' -CompressionLevel Optimal

      - name: Upload Windows app-image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-windows-app-image
          if-no-files-found: error
          path: dist/*
