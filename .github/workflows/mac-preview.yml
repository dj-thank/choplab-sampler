name: ChopLab Mac NEXT preview

# The linked four-stage editor as a local, ad-hoc signed Mac app for the owner to try. Every merge to main
# builds one; pull requests also exercise packaging and cross-process asset ownership changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/mac-preview.yml'
      - 'scripts/package_mac_app.py'
      - 'scripts/stage_mac_preview_distribution.py'
      - 'scripts/install_mac_preview.py'
      - 'scripts/tests/test_mac_*.py'
      - 'scripts/prepare_mac_media_tools.py'
      - 'config/mac-audio-tool-files.txt'
      - 'config/mac-media-tool-files*.txt'
      - 'scripts/mac_tool_policy.py'
      - 'scripts/run_mac_next_acceptance.py'
      - 'scripts/acceptance/MacPreviewLifecycle.java'
      - 'scripts/check_public_surface.py'
      - 'desktop/build.gradle.kts'
      - 'jvm/src/main/kotlin/com/choplab/jvm/FileAssetStore.kt'
      - 'jvm/src/main/kotlin/com/choplab/jvm/AssetStaging.kt'
      - 'jvm/src/test/kotlin/com/choplab/jvm/AssetStagingRecoveryTest.kt'
      - 'jvm/src/test/kotlin/com/choplab/jvm/PersistenceTest.kt'
      - 'jvm/src/main/kotlin/com/choplab/jvm/ai/SourceVocalPreview.kt'
      - 'jvm/src/test/kotlin/com/choplab/jvm/ai/SourceVocalPreviewTest.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  CHOPLAB_SPOTIFY_CLIENT_ID: ${{ vars.CHOPLAB_SPOTIFY_CLIENT_ID }}

jobs:
  mac-next-preview:
    name: Package Mac NEXT preview
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Prepare the local audio build dependency
        run: |
          brew update
          brew install ffmpeg node@24

      - name: Verify Mac process ownership, crash recovery and SOURCE preview
        timeout-minutes: 5
        run: |
          ./gradlew --no-daemon :jvm:test \
            --tests com.choplab.jvm.AssetStagingRecoveryTest \
            --tests com.choplab.jvm.PersistenceTest \
            --tests com.choplab.jvm.ai.SourceVocalPreviewTest

      - name: Package the linked editor as a local ad-hoc Mac app
        run: ./gradlew --no-daemon --stacktrace :desktop:packageMacLinkedPreview

      - name: Archive and check the app, manifest and installer
        run: |
          mkdir -p dist
          python3 scripts/stage_mac_preview_distribution.py \
            --app 'desktop/build/mac-linked-preview-app-image/ChopLab NEXT.app' \
            --manifest desktop/build/mac-linked-preview-app-image/manifest.json \
            --output work/mac-next-distribution
          ditto -c -k --norsrc --noextattr --noacl work/mac-next-distribution dist/ChopLab-mac-next-preview.zip
          python3 scripts/check_public_surface.py --archive dist/ChopLab-mac-next-preview.zip
          (cd dist && shasum -a 256 ChopLab-mac-next-preview.zip > ChopLab-mac-next-preview.zip.sha256)

      - name: Install and update from the actual ZIP in an isolated directory
        run: |
          python3 -m unittest scripts.tests.test_mac_preview_install scripts.tests.test_mac_preview_distribution
          ditto -x -k dist/ChopLab-mac-next-preview.zip "$RUNNER_TEMP/mac-next-download"
          "$RUNNER_TEMP/mac-next-download/インストール.command" --destination "$RUNNER_TEMP/mac-next-install/Applications"
          "$RUNNER_TEMP/mac-next-download/インストール.command" --destination "$RUNNER_TEMP/mac-next-install/Applications"

      - name: Verify installed production and normal close/reopen with an isolated profile
        timeout-minutes: 5
        run: |
          python3 scripts/run_mac_next_acceptance.py \
            --app "$RUNNER_TEMP/mac-next-install/Applications/ChopLab NEXT.app" \
            --manifest "$RUNNER_TEMP/mac-next-install/Applications/.choplab-manifests/ChopLab NEXT.app.json" \
            --java-home "$JAVA_HOME"

      - name: Show the app's signatures after a failure
        if: failure()
        run: |
          app="desktop/build/mac-linked-preview-app-image/ChopLab NEXT.app"
          codesign -dvvv "$app" 2>&1 || true
          codesign -dvvv "$app/Contents/runtime" 2>&1 || true

      - name: Upload the Mac app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-mac-next-preview
          if-no-files-found: error
          path: |
            dist/ChopLab-mac-next-preview.zip
            dist/ChopLab-mac-next-preview.zip.sha256
          retention-days: 7
