name: Apply scoped startup waveform repair

on:
  push:
    branches: [fix/startup-waveform-20260910]
    paths: [.github/workflows/apply-startup-waveform-20260910.yml]

permissions:
  contents: write

concurrency:
  group: apply-startup-waveform-20260910
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'dj-thank/choplab-sampler' && github.ref == 'refs/heads/fix/startup-waveform-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout only the repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same as repository CI
        with:
          ref: fix/startup-waveform-20260910
      - name: Apply exact-hash guarded source changes
        run: python3 scripts/apply-startup-waveform-20260910.py
      - name: Verify diff and commit only scoped source files
        run: |
          git diff --check
          git add app/src/main/java/com/choplab/sampler/SamplerViewModel.kt
          git add shared/src/commonMain/kotlin/com/choplab/sampler/ui/WaveformEditor.kt
          git add docs/PROJECT_STATE.md docs/VALIDATION.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: prepare startup off UI thread and enlarge quiet waveforms without changing PCM'
          git push origin HEAD:refs/heads/fix/startup-waveform-20260910
