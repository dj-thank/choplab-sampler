name: iOS verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public surface
        run: python3 scripts/check_public_surface.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd ios && xcodegen generate --spec project.yml

      - name: Run iOS Simulator tests
        shell: bash
        run: |
          simulator_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $1; exit}' | xargs)"
          test -n "${simulator_name}"
          xcodebuild \
            -project ios/ChopLab.xcodeproj \
            -scheme ChopLab \
            -destination "platform=iOS Simulator,name=${simulator_name}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build unsigned Simulator app
        shell: bash
        run: |
          export CHOPLAB_VERSION="ci-${GITHUB_SHA::7}"
          bash scripts/build-ios-simulator.sh

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-ios-simulator-${{ github.sha }}
          if-no-files-found: error
          path: dist/*
