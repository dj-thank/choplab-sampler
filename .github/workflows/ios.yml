name: iOS verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check public surface
        run: python3 scripts/check_public_surface.py

      - name: Test release policy scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Read release metadata
        id: release
        run: python3 scripts/release_metadata.py --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install pinned XcodeGen
        run: bash scripts/install-xcodegen.sh

      - name: Compile shared Kotlin/Native framework
        run: ./gradlew --stacktrace :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Generate project
        run: cd ios && xcodegen generate --spec project.yml

      - name: Run iOS Simulator tests
        shell: bash
        run: |
          simulator_name="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $1; exit}' | xargs)"
          test -n "${simulator_name}"
          xcodebuild \
            -project ios/ChopLab.xcodeproj \
            -scheme ChopLab \
            -destination "platform=iOS Simulator,name=${simulator_name}" \
            MARKETING_VERSION="${{ steps.release.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.release.outputs.build_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

      - name: Build unsigned Simulator app
        shell: bash
        env:
          CHOPLAB_VERSION: ${{ steps.release.outputs.version }}
          CHOPLAB_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
        run: bash scripts/build-ios-simulator.sh

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: choplab-ios-simulator-${{ github.sha }}
          if-no-files-found: error
          path: dist/*
